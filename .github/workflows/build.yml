# Bauen und testen; bei einem Tag v<Version> den fertigen Plugin-Ordner als Release-Zip anhängen
# (für die Plugin-Bibliothek von Brim, siehe catalog/ im Brim-Repository).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: brim-db

      # Das Plugin baut gegen Brim.Sdk aus dem Brim-Repository, das daneben liegt.
      - uses: actions/checkout@v4
        with:
          repository: wheatley2056/brim
          ref: main
          path: brim

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Tests
        working-directory: brim-db
        run: dotnet test tests/Bahn.Tests -c Release

      - name: Plugin-Ordner bauen
        working-directory: brim-db
        run: dotnet publish src/Bahn -c Release -r win-x64 --self-contained false -o artifacts/bahn

      # Tag und Version im plugin.json müssen gleich sein, sonst lehnt die Bibliothek das Zip ab.
      - name: Version prüfen
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: brim-db
        shell: pwsh
        run: |
          $version = (Get-Content artifacts/bahn/plugin.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "plugin.json hat Version $version, der Tag ist ${{ github.ref_name }}" }

      - name: Zip
        working-directory: brim-db
        shell: pwsh
        run: Compress-Archive -Path artifacts/bahn/* -DestinationPath artifacts/brim-db.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: brim-db
          path: brim-db/artifacts/brim-db.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: brim-db
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/brim-db.zip --title "Bahn-Plugin ${{ github.ref_name }}" --generate-notes
